apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices
spec:
  project: default
  source:
    repoURL: https://github.com/shabaz7323/gitops-argocd-microservices.git
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true